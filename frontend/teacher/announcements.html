<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - BLDEA Teacher</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/teacher.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">👨‍🏫 Faculty Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/teacher/attendance.html" class="nav-item">📅 Attendance</a>
                <a href="/teacher/marks.html" class="nav-item">📝 Marks</a>
                <a href="/teacher/materials.html" class="nav-item">📖 Study Materials</a>
                <a href="/teacher/announcements.html" class="nav-item active">📢 Announcements</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Class Announcements</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" onclick="openModal('announcement-modal')">+ Create Announcement</button>
                </div>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Content Preview</th>
                                    <th>Target Audience</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="announcements-tbody">
                                <tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Loading announcements...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div id="announcement-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Post New Announcement</h3>
                <button class="modal-close" onclick="closeModal('announcement-modal')">×</button>
            </div>
            <form onsubmit="saveAnnouncement(event)">
                <div class="form-group">
                    <label>Announcement Title *</label>
                    <input type="text" id="ann-title" class="form-control" placeholder="e.g. Test Schedule Update" required>
                </div>

                <div class="form-group">
                    <label>Announcement Content *</label>
                    <textarea id="ann-content" class="form-control" rows="4" placeholder="Enter detailed announcement message..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Target Audience *</label>
                    <select id="ann-target" class="form-control">
                        <option value="ALL">ALL (Entire College)</option>
                        <option value="STUDENTS">STUDENTS Only</option>
                        <option value="CLASS">CLASS Specific</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Target Class (Optional if ALL or STUDENTS)</label>
                    <select id="ann-class-select" class="form-control"></select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('announcement-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Post Announcement</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["TEACHER", "ADMIN"])) {
                loadTeacherAnnouncementsPage();
            }
        });
    </script>
</body>
</html>
