<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - BLDEA Teacher</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/teacher.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">👨‍🏫 Faculty Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/teacher/attendance.html" class="nav-item active">📅 Attendance</a>
                <a href="/teacher/marks.html" class="nav-item">📝 Marks</a>
                <a href="/teacher/materials.html" class="nav-item">📖 Study Materials</a>
                <a href="/teacher/announcements.html" class="nav-item">📢 Announcements</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Class Attendance Entry</h2>
                </div>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="toolbar">
                        <div class="toolbar-filters" style="width:100%;">
                            <div class="form-group" style="margin-bottom:0;flex:1;">
                                <label>Select Assigned Class *</label>
                                <select id="attendance-class-select" class="form-control" onchange="loadClassStudentsForAttendance()">
                                    <option value="">-- Loading classes... --</option>
                                </select>
                            </div>
                            <div class="form-group" style="margin-bottom:0;flex:1;">
                                <label>Date *</label>
                                <input type="date" id="attendance-date" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Student USN</th>
                                    <th>Student Name</th>
                                    <th>Attendance Status</th>
                                </tr>
                            </thead>
                            <tbody id="attendance-students-tbody">
                                <tr><td colspan="4" style="text-align:center;color:var(--text-muted);">Select a class above to load enrolled students.</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div style="margin-top:1.5rem;text-align:right;">
                        <button id="submit-attendance-btn" class="btn btn-primary" style="display:none;" onclick="submitBatchAttendance()">Save Attendance</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["TEACHER", "ADMIN"])) {
                loadTeacherAttendancePage();
            }
        });
    </script>
</body>
</html>
