<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials - BLDEA Teacher</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/teacher.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">👨‍🏫 Faculty Portal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/teacher/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/teacher/attendance.html" class="nav-item">📅 Attendance</a>
                <a href="/teacher/marks.html" class="nav-item">📝 Marks</a>
                <a href="/teacher/materials.html" class="nav-item active">📖 Study Materials</a>
                <a href="/teacher/announcements.html" class="nav-item">📢 Announcements</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Course Study Materials</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" onclick="openModal('material-modal')">+ Upload Material</button>
                </div>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Course</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Uploaded Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="materials-tbody">
                                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading study materials...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Upload Material Modal -->
    <div id="material-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Upload Study Material</h3>
                <button class="modal-close" onclick="closeModal('material-modal')">×</button>
            </div>
            <form onsubmit="saveStudyMaterial(event)">
                <div class="form-group">
                    <label>Assigned Class *</label>
                    <select id="mat-class-select" class="form-control" required></select>
                </div>

                <div class="form-group">
                    <label>Material Title *</label>
                    <input type="text" id="mat-title" class="form-control" placeholder="e.g. Chapter 3 - Relational Algebra Notes" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="mat-desc" class="form-control" placeholder="Brief description..."></textarea>
                </div>

                <div class="form-group">
                    <label>Semester</label>
                    <input type="text" id="mat-semester" class="form-control" value="Semester 5">
                </div>

                <div class="form-group">
                    <label>Status *</label>
                    <select id="mat-status" class="form-control">
                        <option value="PUBLISHED">PUBLISHED</option>
                        <option value="DRAFT">DRAFT</option>
                        <option value="ARCHIVED">ARCHIVED</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select File * (PDF, DOCX, PNG, ZIP)</label>
                    <input type="file" id="mat-file" class="form-control" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('material-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Upload & Publish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["TEACHER", "ADMIN"])) {
                loadTeacherMaterialsPage();
            }
        });
    </script>
</body>
</html>
