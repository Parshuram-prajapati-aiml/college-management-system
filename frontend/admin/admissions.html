<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions Workflow - BLDEA Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">🏛️ BLDEA Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/admin/users.html" class="nav-item">👤 Users</a>
                <a href="/admin/students.html" class="nav-item">🎓 Students</a>
                <a href="/admin/teachers.html" class="nav-item">👨‍🏫 Teachers</a>
                <a href="/admin/departments.html" class="nav-item">🏢 Departments</a>
                <a href="/admin/programs.html" class="nav-item">📜 Programs</a>
                <a href="/admin/courses.html" class="nav-item">📚 Courses</a>
                <a href="/admin/classes.html" class="nav-item">🏫 Classes</a>
                <a href="/admin/admissions.html" class="nav-item active">📝 Admissions</a>
                <a href="/admin/documents.html" class="nav-item">📁 Documents</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Admission Applications & Workflow</h2>
                </div>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>App #</th>
                                    <th>Applicant Name / USN</th>
                                    <th>Target Program</th>
                                    <th>Year</th>
                                    <th>Status</th>
                                    <th>Update Status</th>
                                </tr>
                            </thead>
                            <tbody id="admissions-tbody">
                                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading admissions...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["ADMIN", "ADMISSION_OFFICER"])) {
                loadAdmissions();
            }
        });
    </script>
</body>
</html>
