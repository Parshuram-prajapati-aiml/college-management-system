<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Management - BLDEA Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">🏛️ BLDEA Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/admin/users.html" class="nav-item">👤 Users</a>
                <a href="/admin/students.html" class="nav-item">🎓 Students</a>
                <a href="/admin/teachers.html" class="nav-item">👨‍🏫 Teachers</a>
                <a href="/admin/departments.html" class="nav-item">🏢 Departments</a>
                <a href="/admin/programs.html" class="nav-item">📜 Programs</a>
                <a href="/admin/courses.html" class="nav-item active">📚 Courses</a>
                <a href="/admin/classes.html" class="nav-item">🏫 Classes</a>
                <a href="/admin/admissions.html" class="nav-item">📝 Admissions</a>
                <a href="/admin/documents.html" class="nav-item">📁 Documents</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Course Catalog</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" onclick="openAddCourseModal()">+ Add Course</button>
                </div>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Course Code</th>
                                    <th>Course Name</th>
                                    <th>Credits</th>
                                    <th>Department</th>
                                    <th>Semester</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="courses-tbody">
                                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading courses...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Course Modal -->
    <div id="course-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Course</h3>
                <button class="modal-close" onclick="closeModal('course-modal')">×</button>
            </div>
            <form onsubmit="saveCourse(event)">
                <div class="form-group">
                    <label>Department *</label>
                    <select id="course-dept" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Course Code * (e.g. 21CS51)</label>
                    <input type="text" id="course-code" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Course Name *</label>
                    <input type="text" id="course-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Credits</label>
                    <input type="number" id="course-credits" class="form-control" value="3" required>
                </div>
                <div class="form-group">
                    <label>Semester</label>
                    <select id="course-semester" class="form-control">
                        <option value="Semester 1">Semester 1</option>
                        <option value="Semester 2">Semester 2</option>
                        <option value="Semester 3">Semester 3</option>
                        <option value="Semester 4">Semester 4</option>
                        <option value="Semester 5">Semester 5</option>
                        <option value="Semester 6">Semester 6</option>
                        <option value="Semester 7">Semester 7</option>
                        <option value="Semester 8">Semester 8</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('course-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["ADMIN"])) {
                loadCourses();
            }
        });

        async function openAddCourseModal() {
            const res = await apiRequest("/api/departments");
            if (res && res.ok) {
                const depts = await res.json();
                document.getElementById("course-dept").innerHTML = depts.map(d => `<option value="${d.department_id}">${escapeHtml(d.department_name)}</option>`).join("");
            }
            openModal("course-modal");
        }
    </script>
</body>
</html>
