<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - BLDEA Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">🏛️ BLDEA Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/admin/users.html" class="nav-item">👤 Users</a>
                <a href="/admin/students.html" class="nav-item active">🎓 Students</a>
                <a href="/admin/teachers.html" class="nav-item">👨‍🏫 Teachers</a>
                <a href="/admin/departments.html" class="nav-item">🏢 Departments</a>
                <a href="/admin/programs.html" class="nav-item">📜 Programs</a>
                <a href="/admin/courses.html" class="nav-item">📚 Courses</a>
                <a href="/admin/classes.html" class="nav-item">🏫 Classes</a>
                <a href="/admin/admissions.html" class="nav-item">📝 Admissions</a>
                <a href="/admin/documents.html" class="nav-item">📁 Documents</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Student Management</h2>
                </div>
            </header>

            <main class="main-content">
                <div class="toolbar">
                    <div class="toolbar-filters">
                        <select id="status-filter" class="form-control" onchange="loadStudents()">
                            <option value="">All Statuses</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="PROBATION">PROBATION</option>
                            <option value="GRADUATED">GRADUATED</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                    <div class="toolbar-search">
                        <input type="text" id="search-student" class="form-control" placeholder="Search USN, Name, Email..." oninput="loadStudents()">
                    </div>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>USN</th>
                                    <th>Student Name</th>
                                    <th>Email</th>
                                    <th>Department</th>
                                    <th>Program</th>
                                    <th>Semester</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="students-tbody">
                                <tr><td colspan="8" style="text-align:center;color:var(--text-muted);">Loading students...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["ADMIN", "ADMISSION_OFFICER"])) {
                loadStudents();
            }
        });
    </script>
</body>
</html>
