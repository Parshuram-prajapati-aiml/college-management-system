<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management - BLDEA Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">🏛️ BLDEA Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/admin/users.html" class="nav-item">👤 Users</a>
                <a href="/admin/students.html" class="nav-item">🎓 Students</a>
                <a href="/admin/teachers.html" class="nav-item">👨‍🏫 Teachers</a>
                <a href="/admin/departments.html" class="nav-item active">🏢 Departments</a>
                <a href="/admin/programs.html" class="nav-item">📜 Programs</a>
                <a href="/admin/courses.html" class="nav-item">📚 Courses</a>
                <a href="/admin/classes.html" class="nav-item">🏫 Classes</a>
                <a href="/admin/admissions.html" class="nav-item">📝 Admissions</a>
                <a href="/admin/documents.html" class="nav-item">📁 Documents</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>Department Management</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" onclick="openModal('department-modal')">+ Add Department</button>
                </div>
            </header>

            <main class="main-content">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Department Name</th>
                                    <th>Building</th>
                                    <th>HOD Name</th>
                                    <th>Programs</th>
                                    <th>Students</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="departments-tbody">
                                <tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Loading departments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Department Modal -->
    <div id="department-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Department</h3>
                <button class="modal-close" onclick="closeModal('department-modal')">×</button>
            </div>
            <form onsubmit="saveDepartment(event)">
                <div class="form-group">
                    <label>Department Code * (e.g. CSE)</label>
                    <input type="text" id="dept-code" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Department Name *</label>
                    <input type="text" id="dept-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Building Block</label>
                    <input type="text" id="dept-building" class="form-control">
                </div>
                <div class="form-group">
                    <label>HOD Name</label>
                    <input type="text" id="dept-hod" class="form-control">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('department-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Department</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["ADMIN"])) {
                loadDepartments();
            }
        });
    </script>
</body>
</html>
