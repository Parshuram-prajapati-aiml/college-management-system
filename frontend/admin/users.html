<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - BLDEA Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-title">🏛️ BLDEA Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="/admin/users.html" class="nav-item active">👤 Users</a>
                <a href="/admin/students.html" class="nav-item">🎓 Students</a>
                <a href="/admin/teachers.html" class="nav-item">👨‍🏫 Teachers</a>
                <a href="/admin/departments.html" class="nav-item">🏢 Departments</a>
                <a href="/admin/programs.html" class="nav-item">📜 Programs</a>
                <a href="/admin/courses.html" class="nav-item">📚 Courses</a>
                <a href="/admin/classes.html" class="nav-item">🏫 Classes</a>
                <a href="/admin/admissions.html" class="nav-item">📝 Admissions</a>
                <a href="/admin/documents.html" class="nav-item">📁 Documents</a>
                <a href="javascript:logout()" class="nav-item logout">🚪 Logout</a>
            </nav>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="header-topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')">☰</button>
                    <h2>User Account Management</h2>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" onclick="openAddUserModal()">+ Add New User</button>
                </div>
            </header>

            <main class="main-content">
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="toolbar-filters">
                        <select id="role-filter" class="form-control" onchange="loadUsers()">
                            <option value="">All Roles</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="TEACHER">TEACHER</option>
                            <option value="STUDENT">STUDENT</option>
                            <option value="ADMISSION_OFFICER">ADMISSION_OFFICER</option>
                        </select>
                    </div>
                    <div class="toolbar-search">
                        <input type="text" id="search-users" class="form-control" placeholder="Search by username or email..." oninput="loadUsers()">
                    </div>
                </div>

                <!-- Users Table -->
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>User ID</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-tbody">
                                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Loading users...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="user-modal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h3 id="user-modal-title">Add New User</h3>
                <button class="modal-close" onclick="closeModal('user-modal')">×</button>
            </div>
            <form id="user-form" onsubmit="saveUser(event)">
                <input type="hidden" id="user-id">
                
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="user-username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="user-email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Password (leave blank to keep unchanged when editing)</label>
                    <input type="password" id="user-password" class="form-control">
                </div>

                <div class="form-group">
                    <label>Role *</label>
                    <select id="user-role" class="form-control" required>
                        <option value="ADMIN">ADMIN</option>
                        <option value="TEACHER">TEACHER</option>
                        <option value="STUDENT">STUDENT</option>
                        <option value="ADMISSION_OFFICER">ADMISSION_OFFICER</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status *</label>
                    <select id="user-status" class="form-control" required>
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                        <option value="LOCKED">LOCKED</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('user-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkAuth(["ADMIN"])) {
                loadUsers();
            }
        });
    </script>
</body>
</html>
